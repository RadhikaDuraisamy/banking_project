
version: 2

models:
  - name: int_transaction_details
    columns:
      - name: transaction_id
        data_tests:
          - not_null
          - unique

      - name: account_id
        data_tests:
          - not_null

      - name: customer_id
        data_tests:
          - not_null

      - name: branch_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['BR001', 'BR002', 'BR003', 'BR004', 'BR005']
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: branch_id

